AllCops:
  TargetRubyVersion: 2.4
  NewCops: enable # This will automatically enable new cops introduced in the current version

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
